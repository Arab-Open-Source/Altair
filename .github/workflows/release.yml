# Release pipeline for Altair.
#
# Triggered by a `v*` tag push, or manually via `workflow_dispatch`. Builds a
# standalone `altair` binary for the supported platforms, computes a SHA-256
# digest for each artifact and publishes them together as a GitHub Release.
# Consumers rely on the checksums file to verify what they download, and the
# install scripts (`scripts/install.sh` / `scripts/install.ps1`) enforce that
# check before anything is written to disk.
#
# A manual run can target a subset of platforms (e.g. "linux,windows" first,
# then "macos") via the `platforms` input. Partial runs merge their
# checksums with the binaries already attached to the release, so SHA256SUMS
# stays complete no matter how many times the release is published.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build (comma-separated: linux,windows,macos)'
        required: false
        default: 'linux,windows,macos'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
            platform: linux
          - os: ubuntu-latest
            target: linux-arm64
            platform: linux
          - os: macos-latest
            target: macos-amd64
            platform: macos
          - os: macos-latest
            target: macos-arm64
            platform: macos
          - os: windows-latest
            target: windows-amd64
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        if: contains(inputs.platforms || 'linux,windows,macos', matrix.platform)
      - name: Install shards
        run: shards install
        if: contains(inputs.platforms || 'linux,windows,macos', matrix.platform)
      - name: Build (Unix)
        if: runner.os != 'Windows' && contains(inputs.platforms || 'linux,windows,macos', matrix.platform)
        shell: bash
        run: |
          shards build altair --release
          mkdir -p dist
          cp "bin/altair" "dist/altair-${{ matrix.target }}"
      - name: Build (Windows)
        if: runner.os == 'Windows' && contains(inputs.platforms || 'linux,windows,macos', matrix.platform)
        shell: bash
        run: |
          shards build altair --release
          mkdir -p dist
          cp "bin/altair.exe" "dist/altair-${{ matrix.target }}.exe"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: contains(inputs.platforms || 'linux,windows,macos', matrix.platform)
        with:
          name: altair-${{ matrix.target }}
          if-no-files-found: error
          path: dist/altair-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect binaries, installers and checksums
        shell: bash
        run: |
          mkdir -p dist
          cp artifacts/*/altair-* dist/
          # Merge the binaries already attached to this release so SHA256SUMS
          # stays complete across partial (per-platform) runs.
          gh release download "${{ github.ref_name }}" --pattern 'altair-*' --dir dist --clobber 2>/dev/null || true
          cp scripts/install.sh scripts/install.ps1 scripts/install.cmd dist/
          cd dist
          sha256sum altair-* > SHA256SUMS
          cat SHA256SUMS
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          overwrite_files: true
          generate_release_notes: true