name: Deploy website

on:
  push:
    branches: [main]
    paths: ['website/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build site from markdown
        working-directory: website
        run: |
          npm ci
          npm run build
      - name: Stage site
        run: |
          mkdir -p _site/docs _site/assets/css _site/assets/js
          cp website/index.html website/favicon.png _site/
          cp website/docs/*.html _site/docs/
          cp website/assets/css/*.css _site/assets/css/
          cp website/assets/js/*.js _site/assets/js/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
