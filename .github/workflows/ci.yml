# CI pipeline for Altair: format check, static analysis with Ameba and the
# full spec suite on the latest stable Crystal release.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: altair_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
      - name: Install shards
        run: shards install
      - name: Format check
        run: crystal tool format --check src spec examples
      - name: Lint
        run: crystal run lib/ameba/bin/ameba.cr -- src spec examples --format silent
      - name: Specs
        # A startup scheduler flake is tracked in issue #20. Retry only the
        # known signal/futex signatures; real failures and timeouts stop immediately.
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            echo "Spec attempt ${attempt}"
            if timeout 5m crystal spec 2>&1 | tee /tmp/altair-spec.log; then
              exit 0
            else
              status=${PIPESTATUS[0]}
            fi

            retry=false
            case "$status" in
              134|139)
                retry=true
                ;;
              *)
                if grep -q "futex facility returned an unexpected error code" /tmp/altair-spec.log; then
                  retry=true
                fi
                ;;
            esac

            if [[ "$retry" != true || "$attempt" -eq 3 ]]; then
              echo "Specs exited with status ${status}; not retrying" >&2
              exit "$status"
            fi

            echo "::warning::Known scheduler startup flake on attempt ${attempt} (exit ${status}); retrying once after backoff"
            sleep 5
          done
        env:
          ALTAIR_REDIS_URL: redis://localhost:6379
          ALTAIR_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/altair_test
      - name: Upload spec log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: altair-spec-log
          path: /tmp/altair-spec.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Build the altair binary
        run: shards build altair
      - name: PostgreSQL generated-app smoke
        run: scripts/postgres_release_smoke.sh
        env:
          ALTAIR_SKIP_BUILD: "1"
          ALTAIR_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/altair_test
      - name: Build with the official collector (gcry)
        # Altair ships gcry as the official GC; verify the -Dgc_none wiring
        # compiles on every change.
        run: crystal build src/altair_cli.cr -Dgc_none --no-codegen
      - name: Example builds
        run: |
          for entry in hello_world:src/hello_world.cr htmx:src/htmx.cr sqlite_crud:src/app.cr postgresql_crud:src/app.cr showcase:src/showcase.cr; do
            dir=${entry%%:*}
            file=${entry##*:}
            (cd examples/$dir && shards install && crystal build $file --no-codegen)
          done

  test-record-random:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: altair_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
      - name: Install shards
        run: shards install
      - name: Randomized record specs
        run: |
          set -o pipefail
          timeout 8m crystal spec spec/record -- --order random 2>&1 | tee /tmp/altair-record-spec.log
        env:
          ALTAIR_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/altair_test
      - name: Upload record spec log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: altair-record-spec-log
          path: /tmp/altair-record-spec.log
          if-no-files-found: ignore
          retention-days: 7

  test-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
      - name: Install shards
        run: shards install
      - name: Build
        run: shards build altair --release
      - name: Test CLI with spaces in path
        shell: pwsh
        run: |
          # Hyphenated names should be rejected with a suggestion
          $out = ./bin/altair new my-app 2>&1 | Out-String
          if ($out -notmatch "my_app") { throw "Expected suggestion for my-app" }
          # Path with spaces should work when quoted
          $tmp = Join-Path $env:TEMP "Test Space"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          ./bin/altair new "$tmp/my_app" --framework-path . 2>&1 | Out-Null
          if (-not (Test-Path "$tmp/my_app/shard.yml")) { throw "Failed to create project in path with spaces" }
          if (-not (Test-Path "$tmp/my_app/src/my_app.cr")) { throw "Missing src file" }
          Remove-Item -Recurse -Force "$tmp/my_app" -ErrorAction SilentlyContinue
          Write-Host "Windows path handling OK"
