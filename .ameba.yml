# Ameba configuration — Altair lints clean under these settings.
#
# The exclusion keeps ECR templates (not Crystal source) out of the run.
# The two disabled rules and the complexity ceiling document deliberate
# codebase choices: compact `{{ }}` macro expressions (the formatter leaves
# them as written), `not_nil!` where the compiler cannot narrow (route
# helpers, persisted record ids), and the router's large compile-time
# macros.
Excluded:
  - "**/*.ecr"
  # Vendored shard sources (framework `lib/` trees inside examples) follow
  # upstream style; linting them produced noise unrelated to this codebase.
  - "examples/benchmark_k6/app/altair/lib"
  - "examples/read_replica/lib"

Lint/WhitespaceAroundMacroExpression:
  Enabled: false

# The generators embed markdown documentation inside heredocs; their
# indentation carries meaning for the emitted files, so the style rule
# (which wants a fixed +2 offset) fights the content.
Style/HeredocIndent:
  Excluded:
    - "src/altair/cli/generators/new.cr"

Lint/NotNil:
  Enabled: false

Metrics/CyclomaticComplexity:
  MaxComplexity: 15

# `rs` (a DB result set, the shard's own convention), `t` (the schema
# DSL's table builder), `rl` (the rate-limit configure block) and `n`
# (a loop counter) are the codebase's short block parameters.
Naming/BlockParameterName:
  AllowedNames: [a, b, e, i, j, k, v, x, y, k1, k2, v1, v2, db, ex, id, io, ip, op, tx, wg, ws, rs, t, rl, n]

Lint/UselessAssign:
  Excluded:
    - "src/altair/core/request_handler.cr"
